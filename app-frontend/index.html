<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <title>Gestor de Tareas API REST</title> 
    <style>body { font-family: Arial, sans-serif; margin: 40px; background: #f4f7f6; color: 
#333; }</style> 
</head> 
<body> 
    <h1>Mi Gestor de Tareas (Consumiendo API REST)</h1> 
     
    <input type="text" id="inputTarea" placeholder="Escribe una nueva tarea..."> 
    <button onclick="agregarTarea()">Agregar Tarea</button> 
    <button onclick="vaciarListaTareas()">Vaciar Lista de Tareas</button>
 
    <ul id="listaTareas"></ul> 
 
    <script> 
        
        const API_URL = 'http://localhost:5000/api/tareas'; 
 
         
        async function cargarTareas() { 
            const respuesta = await fetch(API_URL); 
            const tareas = await respuesta.json(); 
            const lista = document.getElementById('listaTareas'); 
            lista.innerHTML = ''; 
             
            tareas.forEach(t => { 
                lista.innerHTML += `<li>${t.texto} <button 
onclick="eliminarTarea('${t.id}')">❌</button></li>`; 
            }); 
        } 
 
        
        async function agregarTarea() { 
            const input = document.getElementById('inputTarea'); 
            if (!input.value) return; 
 
            await fetch(API_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ texto: input.value }) 
            }); 
 
            input.value = ''; 
              cargarTareas();  
        } 
 
        
        async function eliminarTarea(id) { 
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' }); 
            cargarTareas();  
        } 

       
        async function vaciarListaTareas() {
            await fetch(`${API_URL}/limpiar`, { method: 'DELETE' });
            cargarTareas(); // Refrescar la vista
        }
 
        
        cargarTareas(); 
    </script> 
</body> 
</html>
